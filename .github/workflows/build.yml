name: Build NOVA-OS prototype

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install NASM and QEMU
        run: sudo apt-get update && sudo apt-get install -y nasm xorriso qemu-system-x86
      - name: Assemble boot sector and kernel image
        run: bash scripts/build.sh
      - name: Boot-test in QEMU
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-x86_64 \
            -machine pc -m 128M \
            -drive file=build/nova-os.img,format=raw,if=floppy \
            -boot a -display none -serial file:build/serial.log \
            -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            echo "QEMU exited unexpectedly with status $status"
            exit "$status"
          fi
          echo "COM1 checkpoint log:"
          cat build/serial.log || true
          if ! grep -q "EGCJPL" build/serial.log; then
            echo "Boot test failed: expected kernel checkpoints EGCJPL in order."
            exit 1
          fi
          if ! grep -q "NOVA OS - 64-bit kernel online" build/serial.log; then
            echo "Boot test failed: interactive kernel banner was not printed."
            exit 1
          fi
          echo "Boot test passed: kernel reached 64-bit long mode and printed its banner."
      - name: Boot-test ISO in QEMU
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-x86_64 \
            -machine pc -m 128M \
            -cdrom build/nova-os.iso -boot d \
            -display none -serial file:build/iso-serial.log \
            -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            echo "QEMU ISO boot exited unexpectedly with status $status"
            exit "$status"
          fi
          echo "ISO COM1 checkpoint log:"
          cat build/iso-serial.log || true
          if ! grep -q "EGCJPL" build/iso-serial.log; then
            echo "ISO boot test failed: expected checkpoints EGCJPL."
            exit 1
          fi
          if ! grep -q "NOVA OS - 64-bit kernel online" build/iso-serial.log; then
            echo "ISO boot test failed: interactive kernel banner was not printed."
            exit 1
          fi
          echo "ISO boot test passed: kernel reached long mode and printed its banner."
      - name: Test CPU exception diagnostics in QEMU
        shell: bash
        run: |
          set -euo pipefail
          nasm -D NOVA_TEST_EXCEPTION=1 -f bin kernel/kernel.asm -o build/kernel-exception-test.bin
          test "$(wc -c < build/kernel-exception-test.bin)" -le 262144
          dd if=/dev/zero of=build/nova-exception-test.img bs=512 count=2880 status=none
          dd if=build/boot.bin of=build/nova-exception-test.img conv=notrunc status=none
          dd if=build/kernel-exception-test.bin of=build/nova-exception-test.img bs=512 seek=1 conv=notrunc status=none
          set +e
          timeout 5s qemu-system-x86_64 \
            -machine pc -m 128M \
            -drive file=build/nova-exception-test.img,format=raw,if=floppy \
            -boot a -display none -serial file:build/exception-serial.log \
            -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            echo "Exception test QEMU exited unexpectedly with status $status"
            exit "$status"
          fi
          cat build/exception-serial.log
          if ! grep -q "NOVA exception vector 0x03" build/exception-serial.log; then
            echo "Exception test failed: IDT did not report the injected INT3."
            exit 1
          fi
          echo "Exception test passed: INT3 was caught and reported by the IDT."
      - name: Smoke-test interactive shell, user mode, and persistent disk through QEMU
        run: python3 scripts/shell-smoke-test.py build/nova-os.img build/nova-data.img
      - name: Upload bootable ISO, floppy image, and logs
        uses: actions/upload-artifact@v4
        with:
          name: nova-os-boot-tested-image
          path: |
            build/nova-os.iso
            build/nova-os.img
            build/nova-data.img
            build/SHA256SUMS.txt
            build/serial.log
            build/iso-serial.log
            build/exception-serial.log
